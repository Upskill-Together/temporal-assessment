<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juniper Salon · Your offer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="phone">
      <p class="eyebrow">Juniper Salon</p>
      <h1 id="title">Loading your offer…</h1>
      <section class="card">
        <dl id="details"></dl>
        <p id="message"></p>
        <p id="timer" class="countdown-big"></p>
        <div id="buttons" hidden>
          <button id="accept">Yes, book me</button>
          <button id="decline" class="secondary">No thanks</button>
        </div>
      </section>
      <p class="footer">Link sent by text from Juniper Salon (simulated). No account needed.</p>
    </main>
    <script src="/offer.js"></script>
  </body>
</html>
